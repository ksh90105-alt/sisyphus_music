<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sisyphus Soundtracks</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 antialiased selection:bg-purple-500 selection:text-white">

    <!-- Top Navigation Bar -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-slate-950/85 backdrop-blur-md border-b border-slate-800/60 px-4 md:px-6 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <span class="w-2.5 h-2.5 rounded-full bg-purple-500 animate-pulse"></span>
            <span id="nav-header-title" class="text-xs font-bold uppercase tracking-widest text-slate-300">Sisyphus Soundtracks</span>
        </div>
        <div class="flex items-center gap-2 bg-slate-900/90 border border-slate-800 px-3 py-1.5 rounded-full shadow-lg">
            <span class="text-xs font-semibold text-purple-400">Soundtrack Archive</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="relative w-full min-h-full pt-16 overflow-x-hidden bg-slate-950">
        <div class="relative z-30 min-h-full bg-slate-950 px-4 md:px-6 py-12">
            <div class="max-w-2xl mx-auto pt-8">
                <div class="text-center mb-12">
                    <h2 id="txt-main-header" class="text-3xl md:text-5xl font-black tracking-tight text-white mb-3">Sisyphus Soundtracks</h2>
                    <p id="txt-main-subtitle" class="text-slate-400 text-base md:text-lg">WORRY & CHUXGSEOB : Music Artist of Hattiman</p>
                </div>
                <div id="tracks-grid" class="flex flex-col gap-8 pb-24"></div>
            </div>
        </div>
    </main>

    <script>
        const DEFAULT_CONFIG = {"transitionEffect":"fade","introBgmUrl":"music1.mp3","textSequences":[{"text":"이 극의 모든 음악은","enterEffect":"fade","exitEffect":"fade","duration":2},{"text":"오직","enterEffect":"slide","exitEffect":"zoom","duration":1.2},{"text":"이 작품만을 위해","enterEffect":"slide","exitEffect":"zoom","duration":1.8},{"text":"치밀하계 설계된 작품입니다","enterEffect":"fade","exitEffect":"fade","duration":1.6}],"introVideo":"stone.gif","introVideoFit":"contain","introVideoPosition":"center","splashDuration":30,"splashTag":"How to make Theatre Music / WoRRY & CHUXGSEOB","splashTitle":"Music of Sisyphus","splashSubtitle":"시네마틱 + 전자음악 + Sound Scape => 부조리한 감각","mainHeaderTitle":"Sisyphus Soundtracks","mainHeaderSubtitle":"WORRY & CHUXGSEOB : Music Artist of Hattiman","tracks":[{"title":"Track 01. Lullaby of Inner Child","scene":"1장 찰나의 평화","description":"어린아이가 칭찬을 받고 행복해하며 잠드는 장면을 떠올리며 만든 자장가입니다. <br>\n성년이 사장에게 인정받은 뒤 그 행복감으로 일을 계속 해나가는 장면에 삽입됩니다.","image":"https://placehold.co/600x400/1e1b4b/e9d5ff?text=Scene+1+Lullaby+of+Inner+Child","audioUrl":"music2.mp3"},{"title":"Track 02. Endless Drops","scene":"2장 성년의 고뇌","description":"성년이 아버지의 생사 여탈권을 쥐고 고민에 휩싸일 때, 대사를 돕는 사운드입니다. <br> 설거지를 잠시 멈추었을 때, 한방울씩 떨어지는 물방울과 흘러드는 노이즈로 함께 성년의 균열의 감각을 여는 Sound scape입니다.","image":"https://placehold.co/600x400/311042/f3e8ff?text=Scene+2+Endless+Drops","audioUrl":"music3.mp3"},{"title":"Track 03. Gaslighting","scene":"2장 의사의 속삭임","description":"생사여탈권을 두고 고민하는 성년을 대하는 의사가 마치 성년의 마음을 대변하듯 변화갑니다. <br>성년의 내면에 잠재된 날카로운 복수의 감각을 일깨우는 전자음악입니다.","image":"https://placehold.co/600x400/1e1b4b/e9d5ff?text=Scene+3+Gaslighting","audioUrl":"music4.mp3"},{"title":"Track 04. Modern Cowboy","scene":"3장 서부의 무법자 ","description":"복수를 두고 고민하는 성년에게 내면들이 속삭입니다. <br>\n넌 뭘 위해 복수를 하고 싶은거야? 넌 왜 견뎌온거야? <br>\n넌 거창한 이유따윈 없잖아. 넌 시지프스가 아냐. <br>\n그냥 도망친 겁쟁이지.","image":"https://placehold.co/600x400/1e1b4b/e9d5ff?text=Scene+4+Modern+Cowboy","audioUrl":"music7.mp3"},{"title":"Track 05. You're Not Sisyphus","scene":"4장 성년의 분열","description":"복수를 두고 고민하는 성년에게 내면들이 속삭입니다. <br>\n넌 뭘 위해 복수를 하고 싶은거야? 넌 왜 견뎌온거야? <br>\n넌 거창한 이유따윈 없잖아. 넌 시지프스가 아냐. 그냥 도망친 겁쟁이지.","image":"https://placehold.co/600x400/1e1b4b/e9d5ff?text=Scene+5+You're+Not+sisyphus","audioUrl":"music6.mp3"},{"title":"Track 06. Bring Us Home","scene":"5장 성년과 병철","description":"환상 속에서, 모든 것을 벗어 던진 성년은 아버지를 마주합니다.\n그 둘은 결국 같은 인간으로, 같은 고통과 삶을 살아가는 존재임을 마주합니다.\n부조리한 둘의 격돌 사이로 평안을 바라는 가스펠 음악이 울려퍼집니다.","image":"https://placehold.co/600x400/1e1b4b/e9d5ff?text=Scene+6+Bring+Us+Home","audioUrl":"music5.mp3"}]};

        function applyConfigToDOM() {
            const setVal = (id, val) => {
                const el = document.getElementById(id);
                if (el) el.innerHTML = val || '';
            };

            setVal('nav-header-title', DEFAULT_CONFIG.mainHeaderTitle);
            setVal('txt-main-header', DEFAULT_CONFIG.mainHeaderTitle);
            setVal('txt-main-subtitle', DEFAULT_CONFIG.mainHeaderSubtitle);

            renderTracks();
        }

        function renderTracks() {
            const grid = document.getElementById('tracks-grid');
            if (!grid) return;
            grid.innerHTML = '';
            (DEFAULT_CONFIG.tracks || []).forEach((track, index) => {
                const card = document.createElement('div');
                card.className = 'bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden shadow-2xl flex flex-col w-full group';
                card.innerHTML = `
                    <div class="relative w-full aspect-video md:aspect-[16/9] overflow-hidden bg-slate-950 cursor-pointer" onclick="toggleTrackAudio(${index})">
                        <img src="${track.image || 'https://placehold.co/600x400/1e1b4b/e9d5ff?text=No+Image'}" alt="${track.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" onerror="this.src='https://placehold.co/600x400/1e1b4b/e9d5ff?text=Image+Error'">
                        <div class="absolute inset-0 bg-black/30 hover:bg-black/10 transition flex items-center justify-center">
                            <div id="play-icon-${index}" class="w-16 h-16 rounded-full bg-purple-600/90 text-white flex items-center justify-center shadow-2xl backdrop-blur-md transform group-hover:scale-110 transition">
                                <svg class="w-8 h-8 ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                            </div>
                        </div>
                        <div class="absolute top-4 left-4 bg-slate-950/80 backdrop-blur-md border border-slate-800 text-purple-300 text-xs font-bold px-3 py-1 rounded-full shadow-lg">
                            ${track.scene || '장면'}
                        </div>
                    </div>
                    <div class="p-6 md:p-8 flex flex-col space-y-4">
                        <div>
                            <h4 class="text-xl font-bold text-white mb-2">${track.title}</h4>
                            <p class="text-sm text-slate-300 leading-relaxed">${track.description}</p>
                        </div>
                        <div class="pt-2">
                            ${track.audioUrl ? `
                                <audio id="audio-el-${index}" class="hidden" src="${track.audioUrl}" preload="none"></audio>
                                <div class="flex items-center justify-between text-xs text-slate-400 bg-slate-950/60 border border-slate-800/80 px-4 py-3 rounded-2xl">
                                    <span id="track-status-${index}">음악 재생 대기중</span>
                                    <button onclick="toggleTrackAudio(${index})" class="px-4 py-2 bg-purple-600 hover:bg-purple-500 text-white font-semibold rounded-xl transition shadow-md cursor-pointer">
                                        재생 / 일시정지
                                    </button>
                                </div>
                            ` : `
                                <div class="text-xs text-slate-500 italic py-2 text-center bg-slate-950/40 rounded-xl border border-slate-800">등록된 오디오가 없습니다.</div>
                            `}
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function toggleTrackAudio(index) {
            const audioEl = document.getElementById(`audio-el-${index}`);
            const statusEl = document.getElementById(`track-status-${index}`);
            const playIcon = document.getElementById(`play-icon-${index}`);
            if (!audioEl) return;

            document.querySelectorAll('audio[id^="audio-el-"]').forEach((el, idx) => {
                if (idx !== index) {
                    el.pause();
                    const otherIcon = document.getElementById(`play-icon-${idx}`);
                    const otherStatus = document.getElementById(`track-status-${idx}`);
                    if (otherIcon) otherIcon.innerHTML = '<svg class="w-8 h-8 ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
                    if (otherStatus) otherStatus.innerText = '음악 재생 대기중';
                }
            });

            if (audioEl.paused) {
                audioEl.play().then(() => {
                    if (statusEl) statusEl.innerText = '🎵 음악 재생 중...';
                    if (playIcon) playIcon.innerHTML = '<svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
                }).catch(e => {
                    if (statusEl) statusEl.innerText = '재생 오류 (파일 경로 확인)';
                });
            } else {
                audioEl.pause();
                if (statusEl) statusEl.innerText = '음악 일시정지됨';
                if (playIcon) playIcon.innerHTML = '<svg class="w-8 h-8 ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
            }

            audioEl.onended = () => {
                if (statusEl) statusEl.innerText = '재생 완료';
                if (playIcon) playIcon.innerHTML = '<svg class="w-8 h-8 ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
            };
        }

        window.onload = function () {
            applyConfigToDOM();
        };
    </script>
</body>
</html>
